services:
  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      CHATGPT2API_SENTINEL_SOLVER_URL: http://sentinel-solver:8080
      CHATGPT2API_SENTINEL_SOLVER_KEY: ${SENTINEL_SOLVER_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      sentinel-solver:
        condition: service_healthy

  sentinel-solver:
    build:
      context: ./sentinel_solver
    image: chatgpt2api-sentinel-solver:local
    restart: unless-stopped
    shm_size: 1gb
    expose:
      - "8080"
    environment:
      SENTINEL_SOLVER_KEY: ${SENTINEL_SOLVER_KEY:-}
      SENTINEL_SOLVER_PROXY: ${SENTINEL_SOLVER_PROXY:-}
      SENTINEL_SOLVER_TIMEZONE: ${SENTINEL_SOLVER_TIMEZONE:-}
      SENTINEL_SOLVER_USER_AGENT: ${SENTINEL_SOLVER_USER_AGENT:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8080/health', headers={'Authorization':'Bearer '+os.environ['SENTINEL_SOLVER_KEY']}); urllib.request.urlopen(req, timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

volumes:
  chatgpt2api-runtime:
